                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="mainNavbar">
                    <form class="d-flex mx-lg-4 my-3 my-lg-0 flex-grow-1">

                    <div class="d-flex align-items-center flex-wrap gap-2">

                        <a href="wishlist.html" class="nav-link">

                        </a>
                        <a href="cart.html" class="nav-link d-flex align-items-center">

    </header>
<main>
    <section class="contact-section py-5">
        <div class="container">

            <div class="text-center mb-5">
                
                <p data-en="We would love to hear from you. Send us your message!"
                    data-ar="يسعدنا التواصل معك! أرسل لنا رسالتك.">
                    We would love to hear from you. Send us your message!
                </p>
            </div>

            <div class="contact-form-container mx-auto">
                <form id="contactForm">

                    <div class="row g-3">

                        <div class="col-md-6">
                            <label for="fullName" data-en="Full Name" data-ar="الاسم الكامل">Full Name</label>
                            <input type="text" id="fullName" class="form-control"
                                placeholder="Enter your name"
                                data-placeholder-en="Enter your name"
                                data-placeholder-ar="أدخل اسمك" required>
                        </div>

                        <div class="col-md-6">
                            <label for="email" data-en="Email Address" data-ar="البريد الإلكتروني">Email Address</label>
                            <input type="email" id="email" class="form-control"
                                placeholder="Enter your email"
                                data-placeholder-en="Enter your email"
                                data-placeholder-ar="أدخل بريدك الإلكتروني" required>
                        </div>

                        <div class="col-md-6">
                            <label for="phone" data-en="Phone Number" data-ar="رقم الهاتف">Phone Number</label>
                            <input type="tel" id="phone" class="form-control"
                                placeholder="Enter your phone number"
                                data-placeholder-en="Enter your phone number"
                                data-placeholder-ar="أدخل رقم هاتفك">
                        </div>

                        <div class="col-md-6">
                            <label for="subject" data-en="Subject" data-ar="الموضوع">Subject</label>
                            <select id="subject" class="form-select" required>
                                <option value="" data-en="Choose a subject" data-ar="اختر الموضوع">Choose a subject</option>
                                <option value="Products" data-en="Products Inquiry" data-ar="استفسار عن المنتجات">Products Inquiry</option>
                                <option value="Orders" data-en="Order Inquiry" data-ar="استفسار عن الطلبات">Order Inquiry</option>
                                <option value="Returns" data-en="Returns" data-ar="الإرجاع">Returns</option>
                                <option value="Other" data-en="Other" data-ar="أخرى">Other</option>
                            </select>
                        </div>

                        <div class="col-12">
                            <label for="message" data-en="Your Message" data-ar="رسالتك">Your Message</label>
                            <textarea id="message" class="form-control" rows="5"
                                placeholder="Write your message here..."
                                data-placeholder-en="Write your message here..."
                                data-placeholder-ar="اكتب رسالتك هنا..." required></textarea>
                        </div>

                        <div class="col-12">
                            <button type="submit" class="contact-btn w-100"
                                data-en="Send Message" data-ar="إرسال الرسالة">
                                Send Message
                            </button>
                        </div>

                    </div>

                    <p id="contactSuccess" class="text-center mt-3" style="display:none;"
                        data-en="Thank you! Your message has been received."
                        data-ar="شكراً لك! تم استلام رسالتك.">
                        Thank you! Your message has been received.
                    </p>

                </form>
            </div>

        </div>
    </section>
</main>

    <footer class="main-footer text-center p-4">
